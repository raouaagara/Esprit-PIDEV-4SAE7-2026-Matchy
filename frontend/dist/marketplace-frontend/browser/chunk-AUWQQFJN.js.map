<div class="auth-page">
  <div class="auth-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
  </div>

  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="logo-icon">M</div>
      <span class="logo-text">Marketplace</span>
    </div>

    <h1 class="auth-title">Créer un compte ✨</h1>
    <p class="auth-subtitle">Rejoignez notre marketplace</p>

    <div class="alert alert-danger" *ngIf="error">
      <span>⚠️</span> {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nom complet</label>
        <input class="form-control" type="text" [(ngModel)]="name" name="name"
               placeholder="Votre nom" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" [(ngModel)]="email" name="email"
               placeholder="vous@exemple.com" required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input class="form-control" type="password" [(ngModel)]="password" name="password"
               placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Je suis</label>
        <div class="role-selector">
          <div class="role-option" [class.active]="role === 'CLIENT'" (click)="role = 'CLIENT'">
            <span class="role-icon">🛍️</span>
            <span class="role-label">Client</span>
            <span class="role-desc">J'achète des projets</span>
          </div>
          <div class="role-option" [class.active]="role === 'ORGANIZER'" (click)="role = 'ORGANIZER'">
            <span class="role-icon">🚀</span>
            <span class="role-label">Organisateur</span>
            <span class="role-desc">Je vends des projets</span>
          </div>
        </div>
      </div>

      <button class="btn btn-primary w-full btn-lg" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Créer mon compte</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <p class="auth-link">
      Déjà un compte ?
      <a routerLink="/auth/login">Se connecter</a>
    </p>
  </div>
</div>
