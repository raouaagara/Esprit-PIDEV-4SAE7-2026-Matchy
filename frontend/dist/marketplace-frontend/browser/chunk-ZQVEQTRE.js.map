<div class="auth-page">
  <div class="auth-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="logo-icon">M</div>
      <span class="logo-text">Marketplace</span>
    </div>

    <h1 class="auth-title">Bon retour 👋</h1>
    <p class="auth-subtitle">Connectez-vous à votre compte</p>

    <div class="alert alert-danger" *ngIf="error">
      <span>⚠️</span> {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" [(ngModel)]="email" name="email"
               placeholder="vous@exemple.com" required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input class="form-control" type="password" [(ngModel)]="password" name="password"
               placeholder="••••••••" required>
      </div>

      <button class="btn btn-primary w-full btn-lg" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <p class="auth-link">
      Pas encore de compte ?
      <a routerLink="/auth/register">Créer un compte</a>
    </p>
  </div>
</div>
